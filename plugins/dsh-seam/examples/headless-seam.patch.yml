# Headless composition: SEAM workflow plugin + local OpenAI-compatible provider.
# Usage:
#   dsh --profile headless --patch <this file> "<task prompt>"
# Env required: SEAM_REPOSITORY, SEAM_DSH_PLUGIN, SEAM_RUN_ROOT, SEAM_PYTHON,
#               SEAM_PROVIDER, SEAM_MODEL, LOCAL_QWEN_KEY (any non-empty string for vLLM).
- id: workflow-worker-thread
  disabled: false
- id: tool-bash
  disabled: false
- id: tool-fs
  disabled: false
- id: tool-fs-search
  disabled: false
- id: llm-pi-ai
  config:
    providers:
      local-qwen:
        displayName: Local Qwen (vLLM 8002)
        api: openai-completions
        baseURL: http://127.0.0.1:8002/v1
        apiKeyEnv: LOCAL_QWEN_KEY
        models:
          - id: qwen3.8-27b
            contextWindow: 262144
- id: agent-default-model
  config:
    provider: local-qwen
    model: qwen3.8-27b
- insert:
    - id: seam-workflow
      name: !!js process.env.SEAM_DSH_PLUGIN
      config:
        repository: !!js process.env.SEAM_REPOSITORY
        runRoot: !!js process.env.SEAM_RUN_ROOT
        python: !!js process.env.SEAM_PYTHON
        workflows:
          kernelbench: src/workflows/npu_kernelbench_custom_op.yaml
        defaultTimeoutSeconds: 7200
        maxPromptBytes: 262144
        roleTools:
          main_engineer: [read, write, edit, glob, grep, bash]
          error_analyzer: [read, glob, grep]
          operator_fixer: [read, write, edit, glob, grep, bash]
          operator_environment_fixer: [read, write, edit, glob, grep, bash]
        roleOptions:
          main_engineer:
            provider: !!js process.env.SEAM_PROVIDER
            model: !!js process.env.SEAM_MODEL
          error_analyzer:
            provider: !!js process.env.SEAM_PROVIDER
            model: !!js process.env.SEAM_MODEL
          operator_fixer:
            provider: !!js process.env.SEAM_PROVIDER
            model: !!js process.env.SEAM_MODEL
          operator_environment_fixer:
            provider: !!js process.env.SEAM_PROVIDER
            model: !!js process.env.SEAM_MODEL
